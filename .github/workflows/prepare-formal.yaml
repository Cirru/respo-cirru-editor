name: Prepare formal Editor contracts
on:
  push:
    branches: [prepare/cirru-editor-formal031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml config/calcit-quality.cirru
      - name: Original formal source gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests-before.json
          yarn build
      - name: Record unchanged baseline before edits
        id: baseline-before
        continue-on-error: true
        run: |
          set -euo pipefail
          calcit analyze quality --baseline config/calcit-quality.cirru --format json > acceptance/quality-before.json
      - name: Official contract transaction
        run: node apply-reviewed.mjs
      - name: Complete formal source gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          calcit docs format-md README.md --check
          calcit docs check-md README.md --failures-only
          VITE_BASE_URL=./ yarn build
      - name: Required unchanged quality gate
        run: |
          set -euo pipefail
          calcit analyze quality --baseline config/calcit-quality.cirru --format json > acceptance/quality.json
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - name: Preserve diagnostics even when required gate fails
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cirru-editor-formal-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
